name: Kubernetes plugin image

on:
  pull_request:
    paths:
      - Dockerfile
      - packages/plugins/sandbox-providers/kubernetes/**
      - packages/plugins/sdk/**
      - packages/shared/**
      - server/src/services/bundled-plugins.ts
      - scripts/generate-plugin-package-json.mjs
      - scripts/link-plugin-dev-sdk.mjs
      - scripts/verify-kubernetes-plugin-image.mjs
      - .github/workflows/kubernetes-plugin-image.yml

permissions:
  contents: read

concurrency:
  group: kubernetes-plugin-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-load:
    name: Build and load final amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build candidate image with the official cloud bundle target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: cloud
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: paperclip-kubernetes-candidate:${{ github.event.pull_request.head.sha }}
          build-args: |
            CLOUD_BUNDLED_PLUGINS=kubernetes
            CLOUD_BUNDLED_SERVER_DEPS=@sentry/node
            PAPERCLIP_BUILD_COMMIT=${{ github.event.pull_request.head.sha }}
            PAPERCLIP_BUILD_VERSION=0.0.0-kubernetes-candidate.g${{ github.event.pull_request.head.sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ github.run_id }}

      - name: Verify bundled plugin and runtime module resolution
        env:
          IMAGE: paperclip-kubernetes-candidate:${{ github.event.pull_request.head.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            --entrypoint node \
            -e EXPECTED_PAPERCLIP_COMMIT="$EXPECTED_SHA" \
            "$IMAGE" \
            /app/scripts/verify-kubernetes-plugin-image.mjs
